<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tabel Data Pencemaran</title>
  <link rel="stylesheet" href="stylePencemaran.css">
</head>

<body>

  <header>
    <h2>LiveForWell</h2>
    <nav>
       <a href="../../index.html">Kembali Ke Dashboard </a>
        <a href="#">Peta</a>
    </nav>
  </header>

  <div class="container">
    <h3>Tabel Data Pencemaran</h3>

    <input type="text" id="searchInput" placeholder="Cari keterangan atau risiko pencemaran...">

    <table>
      <thead>
        <tr>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Keterangan</th>
          <th>Risiko</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <div class="pagination">
      <button id="prevBtn">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Next</button>
    </div>
  </div>

  <script src="mainPencemaran.js"></script>
</body>

</html>
